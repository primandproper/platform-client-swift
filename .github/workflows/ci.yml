# The generated client is committed, so the codegen job's work is proving it is what the
# pinned platform-go tag actually produces — not regenerating it on the fly. A drifted commit
# and a stale pin look identical to a consumer until something fails at runtime.
#
# Each check is its own job so one failing does not hide whether the others pass. Every job
# is macOS for the Swift toolchain, and every job selects the newest Xcode, as a developer
# has: it is the one that refuses a package graph an older SwiftPM accepted, which is how the
# codegen plugins came to be two packages, and swift-format's findings move with it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # There is no separate format job: `swift format lint --strict` fails on any difference
  # `make format` would make, so it would be this job run twice.
  lint:
    name: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      - name: Lint
        run: make lint

  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: make build

  test:
    name: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: make test

  # The Keychain tests need an entitled process, which `swift test` cannot give them; a stub
  # app on a simulator can.
  keychain:
    name: keychain tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen

      - name: Keychain tests
        run: make test-keychain

  codegen:
    name: generated client matches the pinned tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # protoc is pinned here and the plugins are pinned in scripts/plugins/*/Package.swift.
      # `brew install` was what broke this the first time: it installs whatever is current,
      # and swift-protobuf's output changed after 1.33.3.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "33.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Regenerating must reproduce exactly what is committed. This catches a hand-edited
      # generated file, a pin bumped without regenerating, and a regeneration nobody
      # committed — three ways for the checked-in client to stop describing the server.
      - name: Generated client matches the pinned tag
        id: regen
        run: |
          make codegen
          echo "--- resolved plugin versions ---"
          cat scripts/plugins/*/Package.resolved
          git diff --exit-code -- Sources/PlatformClient/Generated || {
            echo "::error::Generated/ does not match what $(cat PLATFORM_GO_VERSION) generates. Run 'make codegen'."
            exit 1
          }

      # When the committed tree and the pinned toolchain disagree, the toolchain is right:
      # it is the pinned one. Publishing its output makes the fix a download-and-commit
      # rather than a guess, which matters on a machine that cannot build the plugins.
      - name: Publish what the pinned toolchain generated
        if: failure() && steps.regen.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-from-pinned-toolchain
          path: Sources/PlatformClient/Generated
